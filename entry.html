<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LBCI ClaIMS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root { --ink:#1A1A1A; --ink-light:#3A3A3A; --gold:#E63946; --gold-light:#F3B4B9;
    --paper:#F5F5F5; --paper-dark:#E8E8E8; --line:#D9D9D9; --text:#1A1A1A; --text-muted:#6B6B6B;
    --danger:#A8202F; --white:#FFFFFF; }
  * { box-sizing:border-box; }
  body { font-family:'IBM Plex Sans',sans-serif; color:var(--text); background:var(--paper); margin:0; padding:0; }
  #appShell { display:flex; align-items:stretch; min-height:100vh; }
  #app { flex:1; min-width:0; padding:28px; }
  .serif { font-family:'Source Serif 4',serif; }
  .mono { font-family:'IBM Plex Mono',monospace; }

  .topbar { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:14px; border-bottom:3px solid var(--gold); padding-bottom:16px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand-mark { width:52px; height:52px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:var(--white); box-shadow:0 0 0 1px var(--line); flex-shrink:0; }
  .brand-mark img { width:100%; height:100%; object-fit:contain; display:block; }
  .brand h1 { font-size:24px; margin:0; color:var(--ink); font-weight:700; }
  .brand p { margin:2px 0 0; font-size:12.5px; color:var(--text-muted); letter-spacing:.03em; }
  .sidebar { width:190px; min-width:190px; background:var(--ink); display:flex; flex-direction:column; align-items:center; padding-bottom:24px; }
  .sidebar-pill { background:var(--gold); border-radius:0 0 36px 36px; width:100%; padding:26px 14px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:26px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .sidebar-pill .logo-circle { width:60px; height:60px; border-radius:50%; overflow:hidden; background:var(--white); border:3px solid var(--white); flex-shrink:0; }
  .sidebar-pill .logo-circle img { width:100%; height:100%; object-fit:contain; display:block; }
  .sidebar-pill h1 { font-size:16px; color:var(--white); margin:2px 0 0; text-align:center; font-style:italic; line-height:1.2; }
  .sidebar-pill p { font-size:9.5px; color:rgba(255,255,255,.85); text-align:center; margin:2px 0 0; line-height:1.3; }
  .sidebar-nav { display:flex; flex-direction:column; gap:20px; align-items:center; }
  .sidebar-nav-group { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  .sidebar-nav-item { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.08); color:#B5B5B5; display:flex; align-items:center; justify-content:center; font-size:17px; transition:background .15s,color .15s; }
  .sidebar-nav-group.active .sidebar-nav-item { background:var(--gold); color:var(--white); }
  .sidebar-nav-group:hover:not(.active) .sidebar-nav-item { background:rgba(255,255,255,.18); color:#fff; }
  .sidebar-nav-label { font-size:9px; color:#8C8C8C; text-align:center; text-transform:uppercase; letter-spacing:.04em; }
  .sidebar-nav-group.active .sidebar-nav-label { color:#fff; }
  .sidebar-sync { margin-top:auto; padding-top:20px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  .btn { border:none; border-radius:5px; padding:9px 15px; font-size:13.5px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Sans',sans-serif; }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:var(--gold); color:var(--white); }
  .btn-ghost { background:var(--white); color:var(--ink); border:1.5px solid var(--line); }
  .btn-danger { background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-icon { padding:7px 10px; }
  .sync-pill { font-size:11.5px; padding:4px 10px; border-radius:20px; background:var(--paper-dark); color:var(--text-muted); display:inline-flex; align-items:center; gap:5px; }
  .sync-pill.on { background:var(--ink); color:var(--white); }
  .sync-pill.syncing { background:#FBEAEC; color:var(--gold); }
  .sync-pill.err { background:#F7D9DC; color:var(--danger); }

  .view-switch { display:flex; gap:6px; margin-bottom:16px; }
  .view-switch button { padding:8px 18px; border-radius:6px; border:1.5px solid var(--line); background:var(--white); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; }
  .view-switch button.active { background:var(--ink); color:var(--white); border-color:var(--ink); }

  .tabs { display:flex; gap:4px; border-bottom:2px solid var(--ink); margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:9px 16px; background:var(--ink); border:1px solid var(--ink); border-bottom:none;
    border-radius:8px 8px 0 0; cursor:pointer; font-size:13.5px; font-weight:500; color:#B5B5B5;
    position:relative; top:2px; display:flex; align-items:center; gap:7px; }
  .tab.active { background:var(--gold); color:var(--white); border-color:var(--gold); top:0; }
  .tab-count { background:rgba(255,255,255,.15); color:#fff; border-radius:10px; padding:1px 7px; font-size:11px; }
  .tab.active .tab-count { background:rgba(255,255,255,.28); }

  .toolbar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .search-box { display:flex; align-items:center; gap:8px; background:var(--white); border:1.5px solid var(--line);
    border-radius:6px; padding:8px 12px; flex:1; min-width:220px; }
  .search-box input { border:none; outline:none; font-size:13.5px; width:100%; background:transparent; font-family:'IBM Plex Sans',sans-serif; }
  select.select { border:1.5px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13.5px; background:var(--white); color:var(--text); font-family:'IBM Plex Sans',sans-serif; }

  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--white); border:1px solid var(--line); border-radius:8px; padding:14px 16px; border-left:4px solid var(--gold); }
  .stat-card .label { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
  .stat-card .value { font-size:20px; font-weight:600; color:var(--ink); font-family:'IBM Plex Mono',monospace; }

  .table-wrap { background:var(--white); border:1px solid var(--line); border-radius:8px; overflow-x:auto; }
  table.claims-table { width:100%; border-collapse:collapse; min-width:960px; }
  .claims-table thead th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); padding:12px 14px; border-bottom:2px solid var(--ink); white-space:nowrap; }
  .claims-table tbody td { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  .claims-table tbody tr:hover { background:var(--paper); cursor:pointer; }
  .claims-table tbody tr:last-child td { border-bottom:none; }
  .row-actions { display:flex; gap:6px; opacity:0; transition:opacity .12s; }
  .claims-table tbody tr:hover .row-actions { opacity:1; }
  .icon-btn { border:none; background:transparent; cursor:pointer; padding:5px 7px; border-radius:4px; color:var(--text-muted); font-size:14px; }
  .icon-btn:hover { background:var(--paper-dark); color:var(--ink); }

  .status-pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; color:var(--white); white-space:nowrap; }
  .lob-tag { font-size:11.5px; color:var(--ink); background:var(--paper-dark); padding:3px 9px; border-radius:4px; white-space:nowrap; }
  .provider-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-left:5px; vertical-align:middle; }
  .aging-badge { font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .aging-badge.stopped { color:var(--text-muted); }
  .aging-badge.overdue { color:var(--danger); font-weight:600; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state h3 { color:var(--ink); font-family:'Source Serif 4',serif; margin:0 0 6px; }

  .overlay { position:fixed; inset:0; background:rgba(26,26,26,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.top { z-index:60; }
  .modal { background:var(--white); border-radius:10px; width:100%; max-width:640px; max-height:88vh; display:flex; flex-direction:column; }
  .modal.wide { max-width:760px; }
  .modal-header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .modal-header h2 { font-size:17px; margin:0; color:var(--ink); }
  .modal-body { padding:20px 22px; overflow-y:auto; }
  .modal-footer { padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }

  .form-section-title { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); font-weight:600; margin:18px 0 10px; }
  .form-section-title:first-child { margin-top:0; }
  .form-tabs { display:flex; gap:4px; margin-bottom:18px; border-bottom:2px solid var(--line); }
  .form-tab { padding:10px 18px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-muted); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; font-family:'IBM Plex Sans',sans-serif; }
  .form-tab.active { color:var(--ink); border-bottom-color:var(--gold); }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field.full { grid-column:1/-1; }
  .field label { font-size:12px; color:var(--text-muted); font-weight:500; }
  .field input, .field select, .field textarea { border:1.5px solid var(--line); border-radius:5px; padding:8px 10px;
    font-size:13.5px; font-family:'IBM Plex Sans',sans-serif; outline:none; width:100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--gold); }
  .field textarea { resize:vertical; min-height:60px; }
  .field input[readonly] { background:var(--paper-dark); font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .stamp { display:inline-block; border:2px solid var(--gold); color:var(--gold); font-family:'IBM Plex Mono',monospace;
    font-weight:600; padding:6px 14px; border-radius:4px; transform:rotate(-2deg); font-size:14px; letter-spacing:.03em; }
  .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; margin-top:16px; }
  .detail-item .k { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  .detail-item .v { font-size:14px; color:var(--text); }
  .detail-item .v.amt { font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .warning-text { color:var(--danger); font-size:12.5px; margin-top:6px; font-weight:600; }
  .yn-toggle { display:flex; gap:8px; }
  .yn-toggle button { flex:1; padding:8px; border-radius:5px; border:1.5px solid var(--line); background:var(--white); color:var(--text); cursor:pointer; font-size:13px; font-weight:600; }
  .yn-toggle button.selected-yes { background:var(--ink); color:#fff; border-color:var(--ink); }
  .yn-toggle button.selected-no { background:var(--danger); color:#fff; border-color:var(--danger); }

  .settlement-row, .rep-row { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
  .rep-row { grid-template-columns:1fr 1fr 1fr 1fr auto; }
  .settlement-row select, .settlement-row input, .rep-row input { border:1.5px solid var(--line); border-radius:5px; padding:7px 9px; font-size:13px; }
  .add-row-btn { font-size:12.5px; color:var(--gold); background:none; border:1.5px dashed var(--gold); border-radius:5px; padding:6px 12px; cursor:pointer; margin-top:2px; }
  .settlement-subtotal { font-size:13px; font-weight:600; color:var(--ink); font-family:'IBM Plex Mono',monospace; margin-top:8px; }

  .checkbox-group { display:flex; flex-wrap:wrap; gap:8px; }
  .checkbox-chip { display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:20px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
  .checkbox-chip input { margin:0; }
  .checkbox-chip.checked { background:var(--paper-dark); border-color:var(--ink); font-weight:600; }

  details.collapsible { border:1px solid var(--line); border-radius:8px; padding:0; margin-top:14px; overflow:hidden; }
  details.collapsible summary { padding:12px 16px; cursor:pointer; font-weight:600; color:var(--ink); background:var(--paper); list-style:none; }
  details.collapsible summary::-webkit-details-marker { display:none; }
  .collapsible-body { padding:14px 16px; border-top:1px solid var(--line); }

  .endorse-field { margin-bottom:12px; }
  .endorse-field label { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:4px; }
  .endorse-box { display:flex; gap:8px; align-items:flex-start; }
  .endorse-box textarea, .endorse-box input { flex:1; border:1.5px solid var(--line); border-radius:5px; padding:9px 11px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; }
  .copy-btn.copied { background:var(--ink) !important; color:#fff !important; border-color:var(--ink) !important; }

  .timeline-entry { border-left:3px solid var(--gold); padding:8px 0 8px 14px; margin-bottom:10px; position:relative; }
  .timeline-entry .t-date { font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; }
  .timeline-entry .t-tags span { font-size:11px; background:var(--paper-dark); color:var(--ink); padding:2px 8px; border-radius:4px; margin-right:5px; display:inline-block; margin-top:4px; }
  .timeline-entry .t-notes { font-size:13px; margin-top:4px; }
  .timeline-entry .t-del { position:absolute; right:0; top:6px; }

  .print-area { display:none; }
  @media print {
    .no-print { display:none !important; }
    .print-area { display:block !important; padding:10px; }
    body { background:white !important; }
  }
  @media (max-width:720px) {
    .form-grid, .detail-grid, .stats-row { grid-template-columns:1fr; }
    #appShell { flex-direction:column; }
    .sidebar { width:100%; min-width:0; flex-direction:row; align-items:center; padding:10px 14px; gap:14px; }
    .sidebar-pill { border-radius:20px; width:auto; flex-direction:row; padding:8px 14px; margin-bottom:0; gap:10px; }
    .sidebar-pill p { display:none; }
    .sidebar-nav { flex-direction:row; gap:10px; margin-left:auto; }
    .sidebar-nav-label { display:none; }
  }
</style>
</head>

const peso = v => { const n = parseFloat(v); return isNaN(n) ? '—' : '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0,10);
function agingDays(c) {
  if (!c.dateOfLoss) return null;
  const start = new Date(c.dateOfLoss);
  const stopped = c.status === 'Closed' || c.status === 'Settled';
  const end = stopped && c.dateClosed ? new Date(c.dateClosed) : new Date();
  return { days: Math.max(Math.floor((end-start)/86400000),0), stopped };
}
function sumSettlements(arr) { return (arr||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0); }
function totalSettled(c) {
  if (c.lineOfBusiness==='Motorcar') return sumSettlements(c.assuredSettlements) + sumSettlements(c.thirdPartySettlements);
  return parseFloat(c.paidAmount)||0;
}
function computeClaimNo(dateReported) {
  const d = dateReported ? new Date(dateReported) : new Date();
  const yyyy = d.getFullYear(); const mm = String(d.getMonth()+1).padStart(2,'0');
  const prefix = `${yyyy}${mm}`;
  const count = state.claims.filter(c => c.claimNo && c.claimNo.startsWith(prefix+'-')).length;
  return `${prefix}-${String(count+1).padStart(2,'0')}`;
}

// ===================== State =====================
let state = {
  claims: [], insureds: [], view: 'claims', activeTab:'All', search:'', statusFilter:'All', insuredSearch:'',
  driveClientId: localStorage.getItem('drive-client-id') || '',
  driveConnected: localStorage.getItem('drive-connected') === '1',
  syncStatus: 'idle', lastSync: localStorage.getItem('drive-last-sync') || null,
};
let tokenClient = null, accessToken = null, tokenExpiry = 0, syncTimer = null;

function loadAll() {
  try { state.claims = JSON.parse(localStorage.getItem('claims-records') || '[]'); } catch(e) { state.claims = []; }
  try { state.insureds = JSON.parse(localStorage.getItem('insureds-records') || '[]'); } catch(e) { state.insureds = []; }
}
function saveClaimsLocal() { localStorage.setItem('claims-records', JSON.stringify(state.claims)); }
function saveInsuredsLocal() { localStorage.setItem('insureds-records', JSON.stringify(state.insureds)); }
function persistAndSync() { saveClaimsLocal(); refreshList(); scheduleSync(); }

function getFiltered() {
  return state.claims.filter(c => {
    if (state.activeTab !== 'All' && c.lineOfBusiness !== state.activeTab) return false;
    if (state.statusFilter !== 'All' && c.status !== state.statusFilter) return false;
    if (state.search.trim()) {
      const q = state.search.toLowerCase();
      const hay = [c.claimNo,c.policyNo,c.insuredName,c.handler,c.location,c.plateNo].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (b.dateReported||'').localeCompare(a.dateReported||''));
}

function setView(v) {
  state.view = v;
  document.querySelectorAll('.sidebar-nav-group[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('claimsView').style.display = v==='claims' ? 'block':'none';

  document.getElementById('addClaimBtn').style.display = v==='claims' ? 'inline-flex':'none';
  document.getElementById('addInsuredBtn').style.display = v==='insureds' ? 'inline-flex':'none';
  document.getElementById('printBtn').style.display = v==='claims' ? 'inline-flex':'none';
  document.getElementById('exportBtn').style.display = v==='claims' ? 'inline-flex':'none';

  if (v==='insureds') renderInsuredsTable();
}
function onShellClick(e) {
  const btn = e.target.closest('[data-action]'); if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'add-claim') openFormModal('add', {...EMPTY_CLAIM, dateReported: todayStr(), lineOfBusiness: state.activeTab !== 'All' ? state.activeTab : 'Motorcar'});
  if (action === 'add-insured') openInsuredModal('add', {name:'',type:'Private',representatives:[]}, {});
  if (action === 'settings') openSettingsModal();
  if (action === 'print-list') printList();
  if (action === 'export-excel') exportExcel();
}

function renderTabs() {
  const counts = { All: state.claims.length };
  LOB_LIST.forEach(l => counts[l] = state.claims.filter(c => c.lineOfBusiness === l).length);
  document.getElementById('tabs').innerHTML = ['All', ...LOB_LIST].map(t =>
    `<div class="tab ${state.activeTab===t?'active':''}" data-tab="${esc(t)}">${esc(t)} <span class="tab-count">${counts[t]||0}</span></div>`
  ).join('');
  document.querySelectorAll('#tabs .tab').forEach(el => el.addEventListener('click', () => { state.activeTab = el.dataset.tab; refreshList(); }));
}

function renderStats(filtered) {
  const openClaims = filtered.filter(c => !['Settled','Closed'].includes(c.status));
  const agings = openClaims.map(agingDays).filter(Boolean).map(a=>a.days);
  const avgAging = agings.length ? Math.round(agings.reduce((s,d)=>s+d,0)/agings.length) : null;
  const settledSum = filtered.reduce((s,c)=>s+totalSettled(c),0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="label">Claims Shown</div><div class="value">${filtered.length}</div></div>
    <div class="stat-card"><div class="label">Open</div><div class="value">${openClaims.length}</div></div>
    <div class="stat-card"><div class="label">Avg. Aging (Open)</div><div class="value">${avgAging!==null?avgAging+'d':'—'}</div></div>
    <div class="stat-card"><div class="label">Total Settled</div><div class="value">${peso(settledSum)}</div></div>`;
}

function agingCell(c) {
  const a = agingDays(c); if (!a) return '—';
  const overdue = !a.stopped && a.days>30;
  return `<span class="aging-badge ${a.stopped?'stopped':''} ${overdue?'overdue':''}">${a.days}d${a.stopped?' ⏸':''}</span>`;
}

function renderTable(filtered) {
  const wrap = document.getElementById('tableWrap');
  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No claims recorded yet</h3><p>Add your first claim to start the registry.</p></div>`;
    return;
  }
  wrap.innerHTML = `<table class="claims-table"><thead><tr>
    <th>Claim No.</th><th>Line of Business</th><th>Insured</th><th>Date of Loss</th><th>Aging</th><th>Status</th><th>Handler</th><th>Claim Amount</th><th></th>
  </tr></thead><tbody>
  ${filtered.map(c => `
    <tr data-id="${c.id}">
      <td class="mono">${esc(c.claimNo)}</td>
      <td><span class="lob-tag">${esc(c.lineOfBusiness)}</span>${c.lineOfBusiness==='Motorcar'&&c.insuranceProvider?`<span class="provider-dot" style="background:${PROVIDER_COLORS[c.insuranceProvider]}" title="${esc(c.insuranceProvider)}"></span>`:''}</td>
      <td>${esc(c.insuredName)}</td>
      <td>${esc(c.dateOfLoss)||'—'}</td>
      <td>${agingCell(c)}</td>
      <td><span class="status-pill" style="background:${STATUS_COLORS[c.status]};color:${STATUS_TEXT[c.status]||'#FFFFFF'}">${esc(c.status)}</span></td>
      <td>${esc(c.handler)||'—'}</td>
      <td class="mono">${peso(c.claimAmount)}</td>
      <td><div class="row-actions">
        <button class="icon-btn" data-view="${c.id}">👁</button>
        <button class="icon-btn" data-edit="${c.id}">✎</button>
        <button class="icon-btn" data-del="${c.id}">🗑</button>
      </div></td>
    </tr>`).join('')}
  </tbody></table>`;
  wrap.querySelectorAll('tr[data-id]').forEach(row => row.addEventListener('click', () => openViewModal(row.dataset.id)));
  wrap.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openViewModal(b.dataset.view); }));
  wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openFormModal('edit', state.claims.find(c=>c.id===b.dataset.edit)); }));
  wrap.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); deleteClaim(b.dataset.del); }));
}
function refreshList() { const filtered = getFiltered(); renderTabs(); renderStats(filtered); renderTable(filtered); }
function deleteClaim(id) {
  if (!confirm('Delete this claim record? This cannot be undone.')) return;
  state.claims = state.claims.filter(c => c.id !== id);
  closeModal(); persistAndSync();
}

function settlementRowHtml(entry) {
  entry = entry || {};
  return `<div class="settlement-row">
    <select class="stl-mode">${SETTLEMENT_MODES.map(m=>`<option value="${m}" ${entry.mode===m?'selected':''}>${m}</option>`).join('')}</select>
    <input class="stl-amount" type="number" placeholder="Amount (₱)" value="${esc(entry.amount||'')}">
    <input class="stl-date" type="date" value="${esc(entry.date||'')}">
    <button type="button" class="icon-btn stl-remove">✕</button>
  </div>`;
}
function setupYnToggle(id, onChangeExtra) {
  const el = document.getElementById(id); if (!el) return;
  el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    el.querySelectorAll('button').forEach(b=>b.classList.remove('selected-yes','selected-no'));

function copyToClipboard(text, btnId) {
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId); const orig = btn.textContent;
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  }).catch(()=> alert('Could not copy — please select and copy the text manually.'));
}
function buildEndorsement(c) {
  const subject = `MOTORCLAIM: ${c.plateNo||''}/${c.policyNo||''}/${c.dateOfLoss||''}`;
  const body = `Dear ${c.insuranceProvider||'[Insurance Provider]'} team,\n\nThis is to formally endorse to your good office the reported claim/s of the assured. Please see details below and attached initial requirements.\n\nInsured Name: ${c.insuredName||''}\nDate of Loss: ${c.dateOfLoss||''}\nPolicy Number: ${c.policyNo||''}\nPlate No: ${c.plateNo||''}\nReported Loss/es: ${(c.reportedLosses||[]).join(', ')}\nContact Person: ${c.contactRepName||''}\n\nKindly acknowledge for your confirmation. Other requested requirements and details to be followed once available.`;
  return {subject, body};
}

function openViewModal(id) {
  const c = state.claims.find(x => x.id === id); if (!c) return;
  const isMotor = c.lineOfBusiness === 'Motorcar';
  const aging = agingDays(c);
  const rows = [];
  rows.push(['Insured Name', c.insuredName]);
  rows.push(['Insured Type', c.insuredType || '—']);
  if (c.contactRepName) rows.push(['Contact Person', c.contactRepName]);
  rows.push(['Policy No.', c.policyNo]);
  rows.push(['Policy Paid?', c.policyPaid || '—']);
  rows.push(['Date of Loss', c.dateOfLoss]);
  rows.push(['Date Reported', c.dateReported]);
  rows.push(['Aging', aging ? (aging.days+'d'+(aging.stopped?' (stopped)':'')) : '—']);
  if (!isMotor) rows.push(['Cause of Loss', c.causeOfLoss || '—']);
  rows.push(['Handler', c.handler]);
  rows.push(['Location', c.location]);
  rows.push(['Contact No.', c.contactNo]);
  let providerHtml = '';
  if (isMotor) {
    if (c.insuranceProvider) providerHtml = `<div class="detail-item"><div class="k">Insurance Provider</div><div class="v"><span class="provider-dot" style="background:${PROVIDER_COLORS[c.insuranceProvider]}"></span> ${esc(c.insuranceProvider)}</div></div>`;
    if (c.insuranceProvider==='Standard') rows.push(['Loaner Car Requested?', c.loanerCarRequested||'—']);
    rows.push(['Reported Loss/es', (c.reportedLosses||[]).join(', ') || '—']);
    LOB_FIELDS['Motorcar'].forEach(f => rows.push([f.label, c[f.key]||'—']));
  } else {
    LOB_FIELDS[c.lineOfBusiness].forEach(f => rows.push([f.label, c[f.key]||'—']));
  }
  let settlementsHtml = '';
  if (isMotor && (c.assuredSettlements||[]).length) settlementsHtml += `<div class="detail-item" style="grid-column:1/-1"><div class="k">Assured Settlement Entries</div><div class="v">${c.assuredSettlements.map(e=>`${esc(e.mode)} — ${peso(e.amount)}${e.date?' ('+esc(e.date)+')':''}`).join('<br>')}<br><strong>Subtotal: ${peso(sumSettlements(c.assuredSettlements))}</strong></div></div>`;

function repRowHtml(entry) {
  entry = entry || {};
  return `<div class="rep-row">
    <input class="rep-name" placeholder="Name" value="${esc(entry.name||'')}">
    <input class="rep-position" placeholder="Position" value="${esc(entry.position||'')}">
    <input class="rep-email" placeholder="Email" value="${esc(entry.email||'')}">
    <input class="rep-contact" placeholder="Contact No." value="${esc(entry.contact||'')}">
    <button type="button" class="icon-btn rep-remove">✕</button>
  </div>`;
}
function openInsuredModal(mode, data, opts) {
  opts = opts || {}; const rootId = opts.rootId || 'modalRoot';
  const d = {...data};
  document.getElementById(rootId).innerHTML = `
    <div class="overlay ${rootId==='modalRoot2'?'top':''}" id="ov_${rootId}">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h2 class="serif">${mode==='add'?'New Insured':'Edit Insured'}</h2><button class="icon-btn" data-close-${rootId}>✕</button></div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="field full"><label>Name *</label><input id="ins_name_${rootId}" value="${esc(d.name||'')}"></div>
            <div class="field full"><label>Type</label><select id="ins_type_${rootId}">${['Private','Corporate','Affiliate'].map(t=>`<option value="${t}" ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
          </div>
          <div id="repsSection_${rootId}" style="display:${d.type&&d.type!=='Private'?'block':'none'};margin-top:14px">
            <div class="form-section-title">Representatives</div>
            <div id="repRows_${rootId}">${(d.representatives&&d.representatives.length?d.representatives:[{}]).map(repRowHtml).join('')}</div>
            <button type="button" class="add-row-btn" id="addRepRow_${rootId}">+ Add Representative</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-close-${rootId}>Cancel</button>
          <button class="btn btn-primary" id="saveInsuredBtn_${rootId}">Save Insured</button>
        </div>
      </div>
    </div>`;
  document.getElementById('ins_type_'+rootId).addEventListener('change', e => {
    document.getElementById('repsSection_'+rootId).style.display = e.target.value!=='Private' ? 'block' : 'none';
  });
  document.getElementById('addRepRow_'+rootId).addEventListener('click', () => document.getElementById('repRows_'+rootId).insertAdjacentHTML('beforeend', repRowHtml({})));
  document.getElementById('repsSection_'+rootId).addEventListener('click', e => { if (e.target.classList.contains('rep-remove')) e.target.closest('.rep-row').remove(); });
  document.getElementById('ov_'+rootId).addEventListener('click', () => document.getElementById(rootId).innerHTML='');
  document.querySelectorAll(`[data-close-${rootId}]`).forEach(b=>b.addEventListener('click', ()=> document.getElementById(rootId).innerHTML=''));
  document.getElementById('saveInsuredBtn_'+rootId).addEventListener('click', () => {
    const name = document.getElementById('ins_name_'+rootId).value.trim();
    if (!name) { alert('Insured name is required.'); return; }
    const type = document.getElementById('ins_type_'+rootId).value;
    let reps = [];
    if (type !== 'Private') {
      reps = Array.from(document.querySelectorAll(`#repRows_${rootId} .rep-row`)).map(row => ({
        id: uid(), name: row.querySelector('.rep-name').value, position: row.querySelector('.rep-position').value,
        email: row.querySelector('.rep-email').value, contact: row.querySelector('.rep-contact').value,
      })).filter(r => r.name);
    }
    const record = { id: d.id || uid(), name, type, representatives: reps };
    if (mode === 'add') state.insureds.push(record); else state.insureds = state.insureds.map(i => i.id===record.id?record:i);
    saveInsuredsLocal(); if (document.getElementById('insuredsTableWrap')) renderInsuredsTable();
    document.getElementById(rootId).innerHTML = '';
    if (opts.onSaved) opts.onSaved(record);
    scheduleSync();
  });
}
function renderInsuredsTable() {
  const q = (state.insuredSearch||'').toLowerCase();
  const list = state.insureds.filter(i => !q || i.name.toLowerCase().includes(q));
  const wrap = document.getElementById('insuredsTableWrap');
  if (!list.length) { wrap.innerHTML = `<div class="empty-state"><h3>No insureds yet</h3><p>Add your first insured record.</p></div>`; return; }
  wrap.innerHTML = `<table class="claims-table"><thead><tr><th>Name</th><th>Type</th><th>Representatives</th><th></th></tr></thead><tbody>
    ${list.map(i=>`<tr>
      <td>${esc(i.name)}</td>
      <td><span class="lob-tag">${esc(i.type)}</span></td>
      <td>${i.type!=='Private' ? ((i.representatives||[]).map(r=>esc(r.name)).join(', ') || '—') : '—'}</td>
      <td><div class="row-actions" style="opacity:1">
        <button class="icon-btn" data-edit-insured="${i.id}">✎</button>
        <button class="icon-btn" data-del-insured="${i.id}">🗑</button>
      </div></td>
    </tr>`).join('')}
  </tbody></table>`;
  wrap.querySelectorAll('[data-edit-insured]').forEach(b=>b.addEventListener('click', ()=> openInsuredModal('edit', state.insureds.find(x=>x.id===b.dataset.editInsured), {})));
  wrap.querySelectorAll('[data-del-insured]').forEach(b=>b.addEventListener('click', ()=> {
    if (!confirm('Delete this insured record?')) return;
    state.insureds = state.insureds.filter(i=>i.id!==b.dataset.delInsured); saveInsuredsLocal(); renderInsuredsTable(); scheduleSync();
  }));
}

function loadSheetJS(cb) {
  if (window.XLSX) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = cb; s.onerror = () => alert('Could not load the Excel export library. Check your internet connection.');
  document.head.appendChild(s);
}
function exportExcel() {
  const filtered = getFiltered();
  if (!filtered.length) { alert('No claims to export for the current view.'); return; }
  loadSheetJS(() => {
    const rows = filtered.map(c => {
      const a = agingDays(c);
      return {
      'Claim No.':c.claimNo,'Line of Business':c.lineOfBusiness,'Insured Name':c.insuredName,'Insured Type':c.insuredType,'Contact Person':c.contactRepName,
      'Policy No.':c.policyNo,'Policy Paid':c.policyPaid,'Date of Loss':c.dateOfLoss,'Date Reported':c.dateReported,
      'Aging Days':a?a.days:'','Aging Stopped':a?(a.stopped?'Yes':'No'):'', 'Status':c.status,'Handler':c.handler,
      'Cause of Loss':c.causeOfLoss||'','Reported Loss/es':(c.reportedLosses||[]).join(', '),'Location':c.location,
      'Insurance Provider':c.insuranceProvider||'','Loaner Car Requested':c.loanerCarRequested||'',
      'Claim Amount':c.claimAmount,'Total Settled':totalSettled(c),
      'Assured Settlements':(c.assuredSettlements||[]).map(e=>`${e.mode}:${e.amount}`).join(' | '),
      'Assured Settlement Total': sumSettlements(c.assuredSettlements),
      'Third Party Settlements':(c.thirdPartySettlements||[]).map(e=>`${e.mode}:${e.amount}`).join(' | '),
      'Third Party Settlement Total': sumSettlements(c.thirdPartySettlements),
      'Contact No.':c.contactNo,'Email':c.email,
      'Plate No.':c.plateNo||'','Vehicle Make/Model':c.vehicleMakeModel||'','Vehicle Year':c.vehicleYear||'','Driver Name':c.driverName||'','Chassis/Engine No.':c.chassisNo||'',
      'Vessel/Conveyance':c.vessel||'','B/L or AWB No.':c.blNo||'','Cargo Description':c.cargoDescription||'','Origin':c.origin||'','Destination':c.destination||'','Shipper/Consignee':c.shipperConsignee||'',
      'Property Address':c.propertyAddress||'','Property Type':c.propertyType||'',
      'Type of Assistance':c.assistanceType||'','Beneficiary Name':c.beneficiaryName||'','Incident Type':c.incidentType||'',
      'Remarks':c.remarks||'',
    };});
    const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = Object.keys(rows[0]).map(()=>({wch:18}));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Claims');
    if (state.insureds.length) {
      const iRows = state.insureds.map(i => ({ 'Name':i.name, 'Type':i.type, 'Representatives': (i.representatives||[]).map(r=>`${r.name} (${r.position}) ${r.email} ${r.contact}`).join(' | ') }));
      const ws2 = XLSX.utils.json_to_sheet(iRows); XLSX.utils.book_append_sheet(wb, ws2, 'Insureds');
    }
    XLSX.writeFile(wb, `claims-registry-${new Date().toISOString().slice(0,10)}.xlsx`);
  });
}

function exportBackupJson() {
  const blob = new Blob([JSON.stringify({claims:state.claims, insureds:state.insureds}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `claims-registry-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function importBackupJson(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const claims = Array.isArray(data) ? data : (data.claims||[]);
      const insureds = Array.isArray(data) ? [] : (data.insureds||[]);
      if (confirm(`Import ${claims.length} claim(s) and ${insureds.length} insured(s)? This will replace your current data.`)) {
        state.claims = claims; state.insureds = insureds; saveInsuredsLocal(); persistAndSync(); closeModal();
      }
    } catch(err) { alert('Could not read that file — make sure it is a Claims Registry backup .json file.'); }
  };
  reader.readAsText(file);
}
function updateDriveStatusUI() {
  const pill = document.getElementById('syncPill'); if (!pill) return;
  if (!state.driveConnected) { pill.className = 'sync-pill'; pill.textContent = '○ Not connected'; return; }
  if (state.syncStatus === 'syncing') { pill.className = 'sync-pill syncing'; pill.textContent = '↻ Syncing…'; return; }
  if (state.syncStatus === 'error') { pill.className = 'sync-pill err'; pill.textContent = '⚠ Sync error'; return; }
  pill.className = 'sync-pill on'; pill.textContent = '● Synced' + (state.lastSync ? ' ' + timeAgo(Number(state.lastSync)) : '');
}
function timeAgo(ts) { const s = Math.floor((Date.now()-ts)/1000); if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+'m ago'; if (s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function setSyncStatus(status) { state.syncStatus = status; updateDriveStatusUI(); }
function ensureGisLoaded(cb, tries) {
  tries = tries || 0;
  if (window.google && window.google.accounts && window.google.accounts.oauth2) { cb(); }
  else if (tries < 40) { setTimeout(() => ensureGisLoaded(cb, tries+1), 250); }
  else { alert('Could not load Google sign-in. Check your internet connection.'); }
}
function initTokenClient(clientId) {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId, scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error) { setSyncStatus('error'); return; }
      accessToken = resp.access_token; tokenExpiry = Date.now() + (resp.expires_in*1000);
      state.driveConnected = true; localStorage.setItem('drive-connected','1');
      updateDriveStatusUI(); pullFromDrive();
    },
  });
}
function connectDrive() {
  if (!state.driveClientId) { openSettingsModal(); return; }
  ensureGisLoaded(() => { initTokenClient(state.driveClientId); tokenClient.requestAccessToken({ prompt: 'consent' }); });
}
function disconnectDrive() {
  if (accessToken && window.google) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; state.driveConnected = false; localStorage.removeItem('drive-connected');
  updateDriveStatusUI(); closeModal();
}
async function ensureToken() {
  if (accessToken && Date.now() < tokenExpiry - 5000) return;
  await new Promise((resolve, reject) => {
    if (!tokenClient) { reject(); return; }
    tokenClient.callback = (resp) => { if (resp.error) { reject(resp.error); return; } accessToken = resp.access_token; tokenExpiry = Date.now()+(resp.expires_in*1000); resolve(); };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}
async function driveFetch(url, opts) {
  opts = opts || {}; await ensureToken();
  const headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, opts.headers || {});
  return fetch(url, Object.assign({}, opts, { headers }));
}
async function findOrCreateFile() {
  let fileId = localStorage.getItem('drive-file-id');
  if (fileId) { const check = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id`); if (check.ok) return fileId; }
  const q = encodeURIComponent(`name='${BACKUP_FILENAME}' and trashed=false`);
  const list = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await list.json();
  if (data.files && data.files.length) { fileId = data.files[0].id; localStorage.setItem('drive-file-id', fileId); return fileId; }
  const metadata = { name: BACKUP_FILENAME, mimeType: 'application/json' };
  const boundary = 'claimsregistryboundary';
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({claims:state.claims, insureds:state.insureds})}\r\n--${boundary}--`;
  const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  const created = await res.json(); localStorage.setItem('drive-file-id', created.id); return created.id;
}
async function pushToDrive() {
  try {
    setSyncStatus('syncing');
    const fileId = await findOrCreateFile();
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({claims:state.claims, insureds:state.insureds}) });
    state.lastSync = Date.now(); localStorage.setItem('drive-last-sync', state.lastSync); setSyncStatus('synced');
  } catch (e) { setSyncStatus('error'); }
}
async function pullFromDrive() {
  try {
    const fileId = await findOrCreateFile();
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (res.ok) {
      const text = await res.text();
      if (text && text.trim()) {
        const remote = JSON.parse(text);
        const rClaims = Array.isArray(remote) ? remote : (remote.claims||[]);
        const rInsureds = Array.isArray(remote) ? [] : (remote.insureds||[]);
        if (rClaims.length >= state.claims.length) { state.claims = rClaims; saveClaimsLocal(); refreshList(); }
        if (rInsureds.length >= state.insureds.length) { state.insureds = rInsureds; saveInsuredsLocal(); if (document.getElementById('insuredsTableWrap')) renderInsuredsTable(); }
      }
    }
    setSyncStatus('synced');
  } catch (e) { setSyncStatus('error'); }
}
function scheduleSync() { if (!state.driveConnected) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushToDrive, 1500); }

// ===================== Init =====================
loadAll();
renderSidebar();
renderShell();
refreshList();
if (state.driveConnected && state.driveClientId) {
  ensureGisLoaded(() => { initTokenClient(state.driveClientId); tokenClient.requestAccessToken({ prompt: '' }); });
}
</script>
